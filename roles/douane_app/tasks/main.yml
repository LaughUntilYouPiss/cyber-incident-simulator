- name: Paquets
  ansible.builtin.apt:
    name: [python3, sqlite3, ca-certificates]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Utilisateur système
  ansible.builtin.user: { name: douane, system: true, shell: /usr/sbin/nologin, create_home: false }

- name: Dossiers
  ansible.builtin.file: { path: "{{ item }}", state: directory, owner: douane, group: douane, mode: "0755" }
  loop: ["{{ douane_dir }}", "{{ douane_db_dir }}"]

- name: Application
  ansible.builtin.copy: { src: douane_app.py, dest: "{{ douane_dir }}/douane_app.py", mode: "0755" }
  notify: Redémarrer douane

- name: Unité systemd
  ansible.builtin.template: { src: douane.service.j2, dest: /etc/systemd/system/douane.service, mode: "0644" }
  notify: Redémarrer douane

- name: Recharger systemd
  ansible.builtin.systemd: { daemon_reload: true }

- name: Service démarré
  ansible.builtin.service: { name: douane, state: started, enabled: true }
